spring.application.name=library-management
server.port=8080

# ---------- Database (H2 file database - no installation needed) ----------
# Data is saved in backend/data/ so it survives restarts.
# A new file for the LMS schema; the old librarydb file is left untouched.
spring.datasource.url=jdbc:h2:file:./data/shelfwise;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 web console: http://localhost:8080/h2-console  (JDBC URL as above, user "sa", empty password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JPA / Hibernate ----------
# The schema is owned by Flyway migrations; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---------- JWT ----------
# Override in production with the JWT_SECRET environment variable (Base64, at least 32 bytes).
app.jwt.secret=${JWT_SECRET:0KEUJr8JxJpKWOYj7Tcn2WB/2BmzfSQF4iWMgKjcQUGMzruNsG4RW0iQwjpCDNwp}
# 24 hours
app.jwt.expiration-ms=86400000

# ---------- CORS (frontend URL) ----------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---------- Library rules ----------
# Loan limits, loan periods and fine rates live per member type in the database
# and are edited by an admin on the Rules page.

# Daily job: due-date reminders, overdue notices and expiring holds (08:00 every day)
app.jobs.daily-cron=0 0 8 * * *
